<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Bryły 3D roju Hexa v2 (szef 11.11: „jakość jak na obrazku, ale modele 3D”):
// Hexa = kula z pancernych płyt, pomarańczowe neonowe szwy, niebieskie wnętrze, oko z sześciokątów.
// Agent = pękaty ośmiokątny dron z soczewką z przodu i z tyłu, złotymi listwami i 8 dyszami.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const Q = new URLSearchParams(location.search), S = +(Q.get('s') || 400), MODEL = Q.get('m') || 'hexa';
const ren = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
ren.setPixelRatio(2); ren.setSize(S / 2, S / 2); ren.setClearColor(0x000000, 0); ren.outputColorSpace = THREE.SRGBColorSpace;
ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 0.62;
document.body.appendChild(ren.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(ren).fromScene(new RoomEnvironment(), 0.03).texture; scene.environmentIntensity = 0.3;
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0, 4.9); cam.lookAt(0, 0, 0);
const L = (c, i, x, y, z) => { const l = new THREE.DirectionalLight(c, i); l.position.set(x, y, z); scene.add(l); };
L(0xffffff, 1.7, -2.5, 3, 4); L(0x4aa0ff, 2.4, 3.5, -1, -1.5); L(0xb070ff, 1.3, -3, -2.5, 0.5); L(0xffffff, 0.35, 1, 1, 5);
scene.add(new THREE.AmbientLight(0x30364a, 0.5));

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const steel = v => new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.6, 0.06, v), metalness: 1, roughness: 0.44 + rnd() * 0.12, flatShading: true });
const darkM = new THREE.MeshStandardMaterial({ color: 0x0c0e12, metalness: 0.95, roughness: 0.45, flatShading: true });
const orange = new THREE.MeshBasicMaterial({ color: 0xff7a05, toneMapped: false });
const orangeHot = new THREE.MeshBasicMaterial({ color: 0xffb648, toneMapped: false });
const blue = v => new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.6 - 0.07 * v, 1, 0.1 + 0.45 * v * v + (v >= 1 ? 0.35 : 0)), toneMapped: false });
const inner = new THREE.MeshStandardMaterial({ color: 0x041226, emissive: 0x0a58d8, emissiveIntensity: 1.6, metalness: 0.6, roughness: 0.5 });

function plate(pts, shrink, rTop, rBot, mat, grp, bevel = 0) {
  const c = pts.reduce((a, p) => a.add(p.clone()), new THREE.Vector3()).divideScalar(pts.length), n = c.clone().normalize();
  const ring = (s, r) => pts.map(p => { const q = c.clone().add(p.clone().sub(c).multiplyScalar(s)); return q.sub(n.clone().multiplyScalar(q.dot(n))).add(n.clone().multiplyScalar(r)); });
  const top = ring(shrink * (1 - bevel), rTop), mid = ring(shrink, rTop - bevel * 0.25), bot = ring(shrink, rBot), ct = n.clone().multiplyScalar(rTop);
  const v = [];
  for (let i = 0; i < pts.length; i++) { const j = (i + 1) % pts.length;
    v.push(ct, top[i], top[j], top[i], mid[i], mid[j], top[i], mid[j], top[j], mid[i], bot[i], bot[j], mid[i], bot[j], mid[j]); }
  const g = new THREE.BufferGeometry().setFromPoints(v); g.computeVertexNormals(); grp.add(new THREE.Mesh(g, mat));
}
function tube(a, b, r, mat, grp) {
  const d = b.clone().sub(a), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); grp.add(m);
}

function hexa() {
  const g = new THREE.Group(), phi = (1 + Math.sqrt(5)) / 2;
  const iv = [[-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0], [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi], [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1]].map(a => new THREE.Vector3(...a));
  const near = (i, j) => Math.abs(iv[i].distanceTo(iv[j]) - 2) < 1e-3;
  const E = []; for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) if (near(i, j)) E.push([i, j]);
  const F = []; for (let a = 0; a < 12; a++) for (let b = a + 1; b < 12; b++) for (let c = b + 1; c < 12; c++) if (near(a, b) && near(b, c) && near(a, c)) F.push([a, b, c]);
  const Lp = (a, b, t) => iv[a].clone().lerp(iv[b], t);
  const sortAround = (pts, n) => { const u = new THREE.Vector3().crossVectors(n, Math.abs(n.y) < .9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0)).normalize(), w = new THREE.Vector3().crossVectors(n, u);
    const c = pts.reduce((a, p) => a.add(p.clone()), new THREE.Vector3()).divideScalar(pts.length), ang = p => Math.atan2(p.clone().sub(c).dot(w), p.clone().sub(c).dot(u));
    return pts.sort((p, q) => ang(p) - ang(q)); };
  const faces = [];
  for (let i = 0; i < 12; i++) { const nb = E.filter(e => e.includes(i)).map(e => e[0] === i ? e[1] : e[0]); faces.push({ k: 5, pts: sortAround(nb.map(j => Lp(i, j, 1 / 3)), iv[i].clone().normalize()) }); }
  for (const [a, b, c] of F) faces.push({ k: 6, pts: sortAround([Lp(a, b, 1 / 3), Lp(a, b, 2 / 3), Lp(b, c, 1 / 3), Lp(b, c, 2 / 3), Lp(c, a, 1 / 3), Lp(c, a, 2 / 3)], iv[a].clone().add(iv[b]).add(iv[c]).normalize()) });
  const R = faces[0].pts[0].length(); faces.forEach(f => f.pts = f.pts.map(p => p.clone().divideScalar(R)));
  const dir = f => f.pts.reduce((a, p) => a.add(p.clone()), new THREE.Vector3()).normalize();
  const eye = faces.find(f => f.k === 6), rot = new THREE.Quaternion().setFromUnitVectors(dir(eye), new THREE.Vector3(0, 0, 1));
  faces.forEach(f => f.pts = f.pts.map(p => p.applyQuaternion(rot)));
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.9, 48, 32), inner));                    // niebieskie wnętrze widoczne w szczelinach
  const seen = new Set();                                                                  // neonowe szwy na krawędziach
  for (const f of faces) for (let i = 0; i < f.pts.length; i++) { const a = f.pts[i], b = f.pts[(i + 1) % f.pts.length];
    const key = [a, b].map(p => p.toArray().map(x => x.toFixed(3)).join()).sort().join('|'); if (seen.has(key)) continue; seen.add(key);
    tube(a.clone().multiplyScalar(0.972), b.clone().multiplyScalar(0.972), 0.017, orange, g); tube(a.clone().multiplyScalar(0.98), b.clone().multiplyScalar(0.98), 0.006, orangeHot, g); }
  const eyeDir = new THREE.Vector3(0, 0, 1);
  for (const f of faces) {
    if (f === eye) {
      plate(f.pts, 0.9, 0.99, 0.9, darkM, g, 0.08);
      [[0.74, 1.0, 0.12], [0.6, 1.006, 0.3], [0.46, 1.012, 0.5], [0.32, 1.018, 0.72], [0.17, 1.024, 1]].forEach(([s, r, v]) => plate(f.pts, s, r, r - 0.02, blue(v), g));
      continue;
    }
    const d = dir(f).dot(eyeDir), nearEye = d > 0.7 && d < 0.95;                           // płyty wokół oka odsłaniają niebieskie wnętrze
    const back = d < -0.95;
    if (back) { plate(f.pts, 0.9, 0.99, 0.9, darkM, g, 0.08); [[0.6, 1.0, 0.25], [0.4, 1.008, 0.55], [0.2, 1.016, 0.9]].forEach(([s, r, v]) => plate(f.pts, s, r, r - 0.02, blue(v), g)); continue; }
    const sh = nearEye ? 0.74 : 0.87, m = f.k === 5 ? steel(0.1 + rnd() * 0.06) : steel(0.22 + rnd() * 0.22);
    plate(f.pts, sh, 1.0, 0.91, m, g, 0.1);                                                // płyta pancerza z fazą
    plate(f.pts, sh * 0.62, 1.022, 0.995, f.k === 5 ? steel(0.07) : m, g, 0.12);           // nakładka
    if (nearEye) { const c = dir(f); f.pts.forEach((p, i) => { const q = f.pts[(i + 1) % f.pts.length], s = 0.8;   // niebieskie świetlówki pod płytą
      tube(c.clone().multiplyScalar(0.93).lerp(p.clone().multiplyScalar(0.93), s), c.clone().multiplyScalar(0.93).lerp(q.clone().multiplyScalar(0.93), s), 0.012, blue(0.6), g); }); }
    f.pts.forEach(p => { const c = dir(f), b = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 6), darkM);                 // nity
      b.position.copy(c.clone().multiplyScalar(1.003).lerp(p.clone().multiplyScalar(1.003), sh * 0.8)); g.add(b); });
  }
  return g;
}

function dron() {
  const g = new THREE.Group(), oct = (rt, rb, h, mat, z) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 8, 1), mat); m.rotation.x = Math.PI / 2; m.rotation.y = Math.PI / 8; m.position.z = z; g.add(m); return m; };
  const body = steel(0.08), frame = steel(0.14);
  oct(0.64, 0.64, 0.3, body, 0);                                             // pas środkowy
  for (const sz of [1, -1]) {
    const fr = oct(sz > 0 ? 0.46 : 0.64, sz > 0 ? 0.64 : 0.46, 0.2, frame, sz * 0.25);   // skos (pękata bryła)
    oct(0.46, 0.46, 0.03, darkM, sz * 0.36);                                 // czoło
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, piv = new THREE.Group(); piv.rotation.z = a;   // złote listwy na skosach
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.3, 0.035), orange); bar.position.set(0.535, 0, sz * 0.262); bar.rotation.y = -sz * 0.73; piv.add(bar);
      const hot = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.26, 0.04), orangeHot); hot.position.copy(bar.position); hot.rotation.y = bar.rotation.y; piv.add(hot);
      const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), steel(0.3)); const a2 = Math.PI / 8; bolt.position.set(0.5 * Math.cos(a2), 0.5 * Math.sin(a2), sz * 0.3); piv.add(bolt); g.add(piv); }
    [[0.4, 0.375, -1], [0.33, 0.385, 0.1], [0.26, 0.395, 0.3], [0.19, 0.405, 0.52], [0.12, 0.415, 0.75], [0.055, 0.425, 1]].forEach(([r, z, v]) => oct(r, r, 0.02, v < 0 ? darkM : blue(v), sz * z));   // soczewka
  }
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + Math.PI / 8, pod = new THREE.Group();     // 8 dysz
    const add = (geo, mat, y) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; pod.add(m); return m; };
    add(new THREE.CylinderGeometry(0.15, 0.17, 0.1, 20), frame, 0.03);
    add(new THREE.CylinderGeometry(0.12, 0.12, 0.12, 20), darkM, 0.13);
    for (let j = 0; j < 10; j++) { const f = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 0.035), steel(0.25)); const b = j * Math.PI / 5; f.position.set(Math.cos(b) * 0.125, 0.13, Math.sin(b) * 0.125); f.rotation.y = -b; pod.add(f); }
    add(new THREE.CylinderGeometry(0.16, 0.15, 0.06, 20), frame, 0.22);
    const ringG = add(new THREE.TorusGeometry(0.125, 0.02, 8, 28), orange, 0.252); ringG.rotation.x = Math.PI / 2;
    add(new THREE.CylinderGeometry(0.1, 0.1, 0.02, 20), darkM, 0.25);
    pod.position.set(Math.cos(a) * 0.6, Math.sin(a) * 0.6, 0); pod.rotation.z = a - Math.PI / 2; g.add(pod); }
  g.scale.setScalar(1.12);
  return g;
}

const obj = MODEL === 'hexa' ? hexa() : dron(); scene.add(obj);
window.frame = (pitchDeg, yawDeg) => { obj.rotation.order = 'XYZ'; obj.rotation.set(THREE.MathUtils.degToRad(pitchDeg), THREE.MathUtils.degToRad(yawDeg), 0); ren.render(scene, cam); return ren.domElement.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
