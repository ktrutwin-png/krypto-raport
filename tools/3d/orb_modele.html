<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Bryły 3D roju Hexa (szef 11.11): Hexa = kula z płyt (ścięty dwudziestościan) ze świecącymi szwami i okiem,
// agent = ośmiokątny dron z kopułkami. Renderowane klatka po klatce do atlasu (różne strony) dla aplikacji ORB.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const Q = new URLSearchParams(location.search), S = +(Q.get('s') || 400), MODEL = Q.get('m') || 'hexa';
const ren = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
ren.setSize(S, S); ren.setClearColor(0x000000, 0); ren.outputColorSpace = THREE.SRGBColorSpace;
ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 0.85;
document.body.appendChild(ren.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(ren).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0, 4.6); cam.lookAt(0, 0, 0);
const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(-2, 3, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x5aa8ff, 2.5); rim.position.set(3, -1, -2); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xc084fc, 1.2); rim2.position.set(-3, -2, -1); scene.add(rim2);
scene.add(new THREE.AmbientLight(0x404060, 0.6));

const metal = new THREE.MeshStandardMaterial({ color: 0x8a939e, metalness: 0.95, roughness: 0.28, flatShading: true });
const dark = new THREE.MeshStandardMaterial({ color: 0x1c2026, metalness: 0.9, roughness: 0.38, flatShading: true });
const gold = new THREE.MeshStandardMaterial({ color: 0xff8a00, emissive: 0xff7a00, emissiveIntensity: 1.6, metalness: 0.3, roughness: 0.4 });
const cyan = k => new THREE.MeshStandardMaterial({ color: 0x0b2a40, emissive: new THREE.Color().setHSL(0.54, 1, 0.22 + 0.2 * k), emissiveIntensity: 1.2 + 2.2 * k, metalness: 0.2, roughness: 0.3, flatShading: true });
const blueWin = new THREE.MeshStandardMaterial({ color: 0x06121e, emissive: 0x0a5cff, emissiveIntensity: 1.3, roughness: 0.5, flatShading: true });

// płyta: wielokąt pts (na sferze) -> wypukła płyta z fazą
function plate(pts, shrink, rTop, rBot, mat, grp) {
  const c = pts.reduce((a, p) => a.add(p.clone()), new THREE.Vector3()).divideScalar(pts.length);
  const n = c.clone().normalize();
  const q = pts.map(p => c.clone().add(p.clone().sub(c).multiplyScalar(shrink)));
  const proj = (p, r) => { const d = p.clone().sub(n.clone().multiplyScalar(p.dot(n))); return d.add(n.clone().multiplyScalar(r)); };
  const top = q.map(p => proj(p, rTop)), bot = q.map(p => proj(p, rBot)), ct = n.clone().multiplyScalar(rTop), cb = n.clone().multiplyScalar(rBot);
  const v = [];
  for (let i = 0; i < q.length; i++) { const j = (i + 1) % q.length;
    v.push(ct, top[i], top[j], cb, bot[j], bot[i], top[i], bot[i], bot[j], top[i], bot[j], top[j]); }
  const g = new THREE.BufferGeometry().setFromPoints(v); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); grp.add(m); return { c, n, q };
}

function hexa() {
  const g = new THREE.Group(), phi = (1 + Math.sqrt(5)) / 2;
  const iv = [[-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0], [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi], [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1]].map(a => new THREE.Vector3(...a));
  const E = []; for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) if (Math.abs(iv[i].distanceTo(iv[j]) - 2) < 1e-3) E.push([i, j]);
  const F = []; for (let a = 0; a < 12; a++) for (let b = a + 1; b < 12; b++) for (let c = b + 1; c < 12; c++)
    if ([[a, b], [b, c], [a, c]].every(([x, y]) => Math.abs(iv[x].distanceTo(iv[y]) - 2) < 1e-3)) F.push([a, b, c]);
  const L = (a, b, t) => iv[a].clone().lerp(iv[b], t);
  const sortAround = (pts, n) => { const u = new THREE.Vector3().crossVectors(n, Math.abs(n.y) < .9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0)).normalize(), w = new THREE.Vector3().crossVectors(n, u);
    const c = pts.reduce((a, p) => a.add(p.clone()), new THREE.Vector3()).divideScalar(pts.length);
    return pts.sort((p, q) => Math.atan2(p.clone().sub(c).dot(w), p.clone().sub(c).dot(u)) - Math.atan2(q.clone().sub(c).dot(w), q.clone().sub(c).dot(u))); };
  const faces = [];
  for (let i = 0; i < 12; i++) { const nb = E.filter(e => e.includes(i)).map(e => e[0] === i ? e[1] : e[0]); faces.push({ k: 5, pts: sortAround(nb.map(j => L(i, j, 1 / 3)), iv[i].clone().normalize()) }); }
  for (const [a, b, c] of F) { const pts = [L(a, b, 1 / 3), L(a, b, 2 / 3), L(b, c, 1 / 3), L(b, c, 2 / 3), L(c, a, 1 / 3), L(c, a, 2 / 3)];
    const n = iv[a].clone().add(iv[b]).add(iv[c]).normalize(); faces.push({ k: 6, pts: sortAround(pts, n) }); }
  const R = faces[0].pts[0].length(); faces.forEach(f => f.pts = f.pts.map(p => p.clone().divideScalar(R)));
  // przód (oko) = sześciokąt najbliżej +Z po obrocie: obracamy całość tak, by wybrany sześciokąt patrzył w +Z
  const eye = faces.find(f => f.k === 6), en = eye.pts.reduce((a, p) => a.add(p.clone()), new THREE.Vector3()).normalize();
  const rot = new THREE.Quaternion().setFromUnitVectors(en, new THREE.Vector3(0, 0, 1));
  faces.forEach(f => f.pts = f.pts.map(p => p.applyQuaternion(rot)));
  const dir = f => f.pts.reduce((a, p) => a.add(p.clone()), new THREE.Vector3()).normalize();
  const hexes = faces.filter(f => f.k === 6 && f !== eye).sort((a, b) => dir(b).z - dir(a).z);
  const windows = new Set([hexes[3], hexes[7], hexes[11], hexes[15], hexes[18]]);   // „okna” z niebieskim wnętrzem (różne strony)
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.955, 64, 48), gold));            // świecące szwy pod płytami
  for (const f of faces) {
    if (f === eye) {
      plate(f.pts, 0.93, 0.93, 0.9, dark, g);
      [[0.86, 0.945, 0], [0.62, 0.955, 0.4], [0.4, 0.965, 0.7], [0.2, 0.975, 1]].forEach(([s, r, k]) => plate(f.pts, s, r, r - 0.03, cyan(k), g));
      continue;
    }
    if (windows.has(f)) { plate(f.pts, 0.9, 0.93, 0.9, blueWin, g); plate(f.pts, 0.5, 0.95, 0.92, cyan(0.6), g); continue; }
    plate(f.pts, 0.9, 1.0, 0.93, metal, g);                    // płyta
    plate(f.pts, 0.62, 1.025, 0.99, f.k === 5 ? dark : metal, g); // wypukły panel na płycie
  }
  return g;
}

function dron() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.66, 0.42, 8, 1), dark); body.rotation.x = Math.PI / 2; body.rotation.y = Math.PI / 8; g.add(body);
  for (const sz of [1, -1]) {
    // obręcz frontu
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.66, 0.06, 8, 1), metal); ring.rotation.x = Math.PI / 2; ring.rotation.y = Math.PI / 8; ring.position.z = sz * 0.22; g.add(ring);
    // złote listwy na krawędziach
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; const bx = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.035, 0.03), gold);
      bx.position.set(Math.cos(a) * 0.53, Math.sin(a) * 0.53, sz * 0.255); bx.rotation.z = a + Math.PI / 2; g.add(bx); }
    // niebieska soczewka – zagnieżdżone ośmiokąty
    [[0.42, 0, 0.23], [0.34, 0.35, 0.245], [0.25, 0.65, 0.26], [0.15, 0.9, 0.275], [0.07, 1, 0.29]].forEach(([r, k, z]) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.02, 8, 1), k === 0 ? dark : cyan(k)); m.rotation.x = Math.PI / 2; m.rotation.y = Math.PI / 8; m.position.z = sz * z; g.add(m); });
  }
  // 8 kopułek na bokach
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + Math.PI / 8; const pod = new THREE.Group();
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.24, 16), dark); cyl.position.y = 0.12; pod.add(cyl);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.03, 16), metal); cap.position.y = 0.25; pod.add(cap);
    const glow = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.022, 8, 24), gold); glow.rotation.x = Math.PI / 2; glow.position.y = 0.265; pod.add(glow);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 0.3), metal); fin.position.y = 0.1; pod.add(fin);
    pod.position.set(Math.cos(a) * 0.6, Math.sin(a) * 0.6, 0); pod.rotation.z = a - Math.PI / 2; g.add(pod); }
  g.scale.setScalar(1.25);
  return g;
}

const obj = MODEL === 'hexa' ? hexa() : dron(); scene.add(obj);
window.frame = (pitchDeg, yawDeg) => { obj.rotation.set(0, 0, 0); obj.rotation.order = 'XYZ'; obj.rotation.x = THREE.MathUtils.degToRad(pitchDeg); obj.rotation.y = THREE.MathUtils.degToRad(yawDeg); ren.render(scene, cam); return ren.domElement.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
