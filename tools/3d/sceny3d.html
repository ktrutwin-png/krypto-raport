/* ---------- 1. LICZBA: wielka metalowa liczba/napis ---------- */
function sLiczba() {

  const g = new THREE.Group(); scene.add(g);

}

/* ---------- 4. POKRETLO: zegar/pokretlo stop procentowych ---------- */
function sPokretlo() {

  const A0 = -2.1, A1 = 2.1, NT = 41, ticks = [];

    const r = 1.36 - (big ? 0.06 : 0); m.position.set(Math.sin(a) * r, Math.cos(a) * r, 0.1); m.rotation.z = -a; g.add(m); ticks.push([m, f]);
  }
  const ns = new THREE.Shape(); ns.moveTo(-0.085, -0.25); ns.lineTo(0.085, -0.25); ns.lineTo(0.02, 1.2); ns.lineTo(-0.02, 1.2); ns.closePath();
  const needle = new THREE.Mesh(new THREE.ExtrudeGeometry(ns, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2 }), metal(GOLD, 74)); needle.position.z = 0.16; g.add(needle);

}

/* ---------- 5. SKARBIEC: otwierajace sie drzwi sejfu, w srodku sztabki ---------- */

/* ---------- 6. GLOBUS: Ziemia z kropek + luki przeplywow ---------- */
function sGlobus() {
  frame(4.6); floor.visible = false; glow('24,70,170', 11, [0, 1.7, -4], 0.8);
  const R = 1.75, g = new THREE.Group(); g.position.y = FLOOR_Y + 2.3; scene.add(g);
  const LAND = [
    [[70, -160], [72, -120], [75, -90], [62, -66], [50, -56], [44, -66], [30, -81], [25, -80], [29, -95], [18, -95], [15, -90], [9, -80], [16, -98], [23, -106], [32, -117], [48, -125], [58, -137], [60, -147], [55, -163]],
    [[12, -72], [10, -62], [-1, -50], [-6, -35], [-23, -41], [-35, -57], [-54, -68], [-45, -74], [-18, -70], [-5, -81], [5, -77]],
    [[71, 25], [68, 45], [55, 60], [45, 40], [41, 29], [36, 22], [40, 15], [44, 8], [36, -6], [38, -9], [43, -9], [48, -5], [51, 2], [58, -6], [58, 8], [62, 5]],
    [[37, 10], [32, 32], [22, 37], [12, 43], [11, 51], [-4, 40], [-15, 40], [-26, 33], [-35, 20], [-17, 12], [4, 9], [5, -8], [15, -17], [28, -13], [36, -6]],
    [[72, 60], [77, 105], [72, 140], [68, 178], [60, 163], [53, 141], [43, 132], [38, 122], [30, 122], [22, 108], [10, 105], [1, 103], [8, 98], [16, 95], [22, 90], [8, 77], [22, 70], [25, 58], [13, 45], [30, 35], [41, 29], [45, 40], [55, 60]],
    [[-11, 131], [-12, 142], [-25, 153], [-38, 146], [-35, 117], [-22, 114], [-14, 127]],
    [[83, -35], [76, -20], [60, -43], [70, -55], [78, -70]], [[45, 141], [35, 140], [33, 131], [36, 136], [41, 140]], [[-6, 106], [-8, 114], [-2, 120], [5, 117], [2, 110]]];
  const inside = (la, lo, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [yi, xi] = p[i], [yj, xj] = p[j]; if ((yi > la) !== (yj > la) && lo < (xj - xi) * (la - yi) / (yj - yi) + xi) c = !c; } return c; };
  const xyz = (la, lo, r = R) => { const a = la * Math.PI / 180, b = lo * Math.PI / 180; return new THREE.Vector3(r * Math.cos(a) * Math.sin(b), r * Math.sin(a), r * Math.cos(a) * Math.cos(b)); };
  const pts = [], NP = 16000;
  for (let i = 0; i < NP; i++) { const y = 1 - 2 * (i + 0.5) / NP, la = Math.asin(y) * 180 / Math.PI, lo = ((i * 137.508) % 360) - 180; if (LAND.some(p => inside(la, lo, p))) { const v = xyz(la, lo, R * 1.004); pts.push(v.x, v.y, v.z); } }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: new THREE.Color(0.55, 2.0, 2.6), size: 0.034, toneMapped: false })));
  g.add(shadow(new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), new THREE.MeshStandardMaterial({ color: 0x06122a, metalness: 0.6, roughness: 0.32, envMap: env, envMapIntensity: 0.7 }))));
  const grid = new THREE.Mesh(new THREE.SphereGeometry(R * 1.002, 24, 12), new THREE.MeshBasicMaterial({ color: 0x1b6fb0, wireframe: true, transparent: true, opacity: 0.16 })); g.add(grid);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(R * 1.32, 0.012, 8, 200), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.7, 1.25, 0.45), toneMapped: false })); halo.rotation.x = 1.35; g.add(halo);
  const luki = P.luki || [[40.7, -74, 51.5, -0.1], [51.5, -0.1, 25.2, 55.3], [40.7, -74, -23.5, -46.6], [51.5, -0.1, 1.3, 103.8]];
  const arcs = luki.map(([a1, o1, a2, o2]) => {
    const A = xyz(a1, o1), B = xyz(a2, o2), mid = A.clone().add(B).multiplyScalar(0.5), lift = 1 + A.distanceTo(B) / R * 0.42; mid.normalize().multiplyScalar(R * lift);
    const geo = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(A, mid, B), 64, 0.009, 8, false);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 1.75, 0.6), toneMapped: false })); g.add(m);
    for (const v of [A, B]) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 2.3, 0.8), toneMapped: false })); d.position.copy(v); g.add(d); }
    return [m, geo.index.count];
  });
  const lon0 = (P.lon0 ?? -30) * Math.PI / 180;
  return t => {
    g.rotation.set(0.32, -lon0 - 0.5 + t * 0.2, 0); halo.rotation.z = t * 0.5;
    arcs.forEach(([m, cnt], i) => { const k = eio((t - 0.5 - i * 0.45) / 1.3); m.geometry.setDrawRange(0, Math.floor(cnt * k / 48) * 48); });
    orbit(t, -0.06, 0.06, g.position.y + 0.5, [0, g.position.y - 0.05, 0]);
  };
}
